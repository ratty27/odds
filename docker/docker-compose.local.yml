version: '3.8'

services:
  app:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=odds
      - DB_USERNAME=odds_user
      - DB_PASSWORD=local_password
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
    depends_on:
      - mysql
    volumes:
      - ../storage:/var/www/html/storage:delegated
      - ../public:/var/www/html/public:delegated
      - ../resources:/var/www/html/resources:delegated
      - ../app:/var/www/html/app:delegated
      - ../routes:/var/www/html/routes:delegated
      - ../config:/var/www/html/config:delegated

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: odds
      MYSQL_USER: odds_user
      MYSQL_PASSWORD: local_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_local_data:/var/lib/mysql

volumes:
  mysql_local_data:
