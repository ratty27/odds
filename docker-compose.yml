version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-odds}
      - DB_USERNAME=${DB_USERNAME:-odds_user}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    depends_on:
      - mysql
    volumes:
      - ./storage:/var/www/html/storage

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${DB_DATABASE:-odds}
      MYSQL_USER: ${DB_USERNAME:-odds_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
